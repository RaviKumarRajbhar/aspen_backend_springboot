


services:

  postgres-db:
    image: postgres:16
    container_name: postgres-db

    environment:
      POSTGRES_DB: aspen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped



  redis-cache:
    image: redis:7
    container_name: redis-cache

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    restart: unless-stopped



volumes:
  postgres_data:
  redis_data: